name: Validation du catalogue pédagogique

on:
  push:
    branches:
      - cleanup-foundation
    paths:
      - "js/course-data.js"
      - "js/course-page.js"
      - "js/firebase.js"
      - "js/header-auth.js"
      - "l1.html"
      - "l2.html"
      - "l3.html"
      - "cours/matiere.html"
      - "cours/matieres/**"
      - "style.css"
      - "scripts/validate-course-data.mjs"
      - ".github/workflows/course-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-course-catalog:
    name: Vérifier le catalogue et la navigation
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Valider les cours et les liens
        run: node scripts/validate-course-data.mjs
