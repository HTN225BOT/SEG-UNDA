<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | SEG UNDA</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-page {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 7%;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 217, 255, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(124, 92, 255, 0.18),
          transparent 35%
        );
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 40px 32px;
      background: rgba(20, 24, 48, 0.88);
      border: 1px solid rgba(124, 92, 255, 0.35);
      border-radius: 25px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(0, 217, 255, 0.06);
      text-align: center;
    }

    .login-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #00d9ff
      );
      color: white;
      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.20);
    }

    .login-icon svg {
      width: 36px;
      height: 36px;
    }

    .login-card h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .login-card > p {
      margin-bottom: 30px;
      color: #aeb6d0;
      font-size: 0.92rem;
    }

    .login-form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      box-sizing: border-box;
      border: 1px solid rgba(124, 92, 255, 0.35);
      border-radius: 13px;
      background: rgba(8, 11, 24, 0.75);
      color: white;
      outline: none;
      font-size: 0.95rem;
      transition: 0.3s ease;
    }

    .form-group input:focus {
      border-color: #00d9ff;
      box-shadow:
        0 0 15px rgba(0, 217, 255, 0.12);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 60px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8f98b3;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .show-password:hover {
      color: #00d9ff;
    }

    .forgot-password {
      display: block;
      margin-top: -5px;
      margin-bottom: 25px;
      color: #00d9ff;
      text-decoration: none;
      font-size: 0.85rem;
      text-align: right;
    }

    .login-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #00d9ff
      );
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.15);
      transition: 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(0, 217, 255, 0.25);
    }

    .google-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .google-btn:hover {
      border-color: #00d9ff;
      background: rgba(0, 217, 255, 0.08);
      transform: translateY(-2px);
    }

    .google-logo {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .login-message {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #00d9ff;
      min-height: 20px;
    }

    .login-info {
      margin-top: 25px;
      color: #8f98b3;
      font-size: 0.8rem;
    }

    .back-home {
      display: inline-block;
      margin-top: 25px;
      color: #8f98b3;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }

    .back-home:hover {
      color: #00d9ff;
    }

    .register-link {
      display: block;
      margin-top: 20px;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .register-link span {
      color: #00d9ff;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .login-page {
        padding: 45px 5%;
      }

      .login-card {
        padding: 32px 22px;
      }

      .login-card h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      <img
        src="seg-unda-logo.png"
        alt="Logo SEG UNDA"
      >
    </div>

    <nav>
      <a href="index.html">
        Accueil
      </a>

      <a href="licence.html">
        Formations
      </a>

      <a href="licence.html">
        Cours
      </a>

      <a href="index.html#apropos">
        À propos
      </a>
    </nav>

    <a
      href="connexion.html"
      class="header-btn"
    >
      Connexion
    </a>

  </header>


  <main class="login-page">

    <div class="login-card">

      <div class="login-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <circle
            cx="12"
            cy="8"
            r="4"
            stroke="white"
            stroke-width="2"
          />

          <path
            d="M4 21C4.8 16.8 7.4 14 12 14C16.6 14 19.2 16.8 20 21"
            stroke="white"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>

      </div>


      <h1>
        Bienvenue
      </h1>

      <p>
        Connecte-toi à ton espace SEG UNDA.
      </p>


      <form
        class="login-form"
        id="loginForm"
      >

        <div class="form-group">

          <label for="email">
            Adresse e-mail
          </label>

          <input
            type="email"
            id="email"
            placeholder="exemple@email.com"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Mot de passe
          </label>

          <div class="password-box">

            <input
              type="password"
              id="password"
              placeholder="Ton mot de passe"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              Afficher
            </button>

          </div>

        </div>


        <a
          href="#"
          class="forgot-password"
          id="forgotPassword"
        >
          Mot de passe oublié ?
        </a>


        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Se connecter
        </button>

      </form>


      <button
        type="button"
        class="google-btn"
        id="googleBtn"
      >

        <svg
          class="google-logo"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            fill="#4285F4"
            d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.42h3.14c1.84-1.69 2.92-4.18 2.92-7.38z"
          />

          <path
            fill="#34A853"
            d="M12 21.67c2.63 0 4.84-.87 6.45-2.36l-3.14-2.42c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.5A9.75 9.75 0 0 0 12 21.67z"
          />

          <path
            fill="#FBBC05"
            d="M6.54 13.79A5.86 5.86 0 0 1 6.23 12c0-.62.11-1.22.31-1.79v-2.5H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.29l3.24-2.5z"
          />

          <path
            fill="#EA4335"
            d="M12 6.18c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.26 14.63 2.33 12 2.33a9.75 9.75 0 0 0-8.7 5.38l3.24 2.5C7.31 7.9 9.46 6.18 12 6.18z"
          />

        </svg>

        <span>
          Se connecter avec Google
        </span>

      </button>


      <div
        class="login-message"
        id="loginMessage"
      ></div>


      <a
        href="#"
        class="register-link"
        id="registerLink"
      >
        Pas encore de compte ?
        <span>Créer un compte</span>
      </a>


      <p class="login-info">
        Ton espace étudiant SEG UNDA.
      </p>


      <a
        href="index.html"
        class="back-home"
      >
        ← Retour à l'accueil
      </a>

    </div>

  </main>


  <footer>

    <p>
      SEG UNDA — Sciences Économiques et de Gestion
    </p>

    <div class="signature">

      <span class="michael">
        MICHAEL
      </span>

      <small>
        Étudiant
      </small>

    </div>

  </footer>


  <!-- ==============================
       FIREBASE
       ============================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    /* ==============================
       CONFIGURATION FIREBASE
       ============================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyC4ejbTOO1G3XbwDJ5KYH6-CiYcdQqr68k",

      authDomain:
        "seg-unda.firebaseapp.com",

      projectId:
        "seg-unda",

      storageBucket:
        "seg-unda.firebasestorage.app",

      messagingSenderId:
        "1076997262231",

      appId:
        "1:1076997262231:web:31b640fa8fd5991e8612d2"

    };


    /* ==============================
       INITIALISATION
       ============================== */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const provider =
      new GoogleAuthProvider();


    /* ==============================
       ÉLÉMENTS DE LA PAGE
       ============================== */

    const loginForm =
      document.getElementById("loginForm");

    const googleBtn =
      document.getElementById("googleBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const registerLink =
      document.getElementById("registerLink");

    const showPassword =
      document.getElementById("showPassword");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");


    /* ==============================
       MESSAGE
       ============================== */

    function showMessage(message) {

      loginMessage.textContent =
        message;

    }


    /* ==============================
       ERREURS FIREBASE
       ============================== */

    function firebaseError(error) {

      switch (error.code) {

        case "auth/invalid-email":
          return "Adresse e-mail invalide.";

        case "auth/user-not-found":
          return "Aucun compte ne correspond à cette adresse e-mail.";

        case "auth/wrong-password":
          return "Mot de passe incorrect.";

        case "auth/invalid-credential":
          return "Adresse e-mail ou mot de passe incorrect.";

        case "auth/email-already-in-use":
          return "Cette adresse e-mail possède déjà un compte.";

        case "auth/weak-password":
          return "Le mot de passe doit contenir au moins 6 caractères.";

        case "auth/popup-closed-by-user":
          return "La fenêtre Google a été fermée.";

        case "auth/network-request-failed":
          return "Problème de connexion Internet.";

        case "auth/unauthorized-domain":
          return "Ce domaine n'est pas autorisé dans Firebase.";

        case "auth/operation-not-allowed":
          return "Cette méthode de connexion n'est pas activée dans Firebase.";

        default:
          return "Une erreur est survenue. Réessaie.";

      }

    }


    /* ==============================
       RÉSULTAT GOOGLE AU RETOUR
       ============================== */

    try {

      const result =
        await getRedirectResult(auth);

      if (result && result.user) {

        showMessage(
          "Connexion réussie ! Redirection..."
        );

        setTimeout(() => {

          window.location.replace(
            "./index.html"
          );

        }, 500);

      }

    } catch (error) {

      console.error(
        "Erreur Google :",
        error
      );

      showMessage(
        firebaseError(error)
      );

    }


    /* ==============================
       CONNEXION E-MAIL
       ============================== */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        showMessage(
          "Connexion en cours..."
        );

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Connexion réussie ! Redirection..."
          );

          setTimeout(() => {

            window.location.replace(
              "./index.html"
            );

          }, 500);

        } catch (error) {

          console.error(error);

          showMessage(
            firebaseError(error)
          );

        }

      }
    );


    /* ==============================
       CRÉATION DE COMPTE
       ============================== */

    registerLink.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showMessage(
            "Entre ton e-mail et un mot de passe pour créer ton compte."
          );

          return;

        }

        showMessage(
          "Création du compte..."
        );

        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage(
            "Compte créé ! Redirection..."
          );

          setTimeout(() => {

            window.location.replace(
              "./index.html"
            );

          }, 500);

        } catch (error) {

          console.error(error);

          showMessage(
            firebaseError(error)
          );

        }

      }
    );


    /* ==============================
       CONNEXION GOOGLE
       ============================== */

    googleBtn.addEventListener(
      "click",
      async () => {

        showMessage(
          "Redirection vers Google..."
        );

        googleBtn.disabled = true;

        try {

          await signInWithRedirect(
            auth,
            provider
          );

        } catch (error) {

          console.error(error);

          googleBtn.disabled = false;

          showMessage(
            firebaseError(error)
          );

        }

      }
    );


    /* ==============================
       MOT DE PASSE OUBLIÉ
       ============================== */

    forgotPassword.addEventListener(
      "click",
      async (event) => {

        event.preventDefault();

        const email =
          emailInput.value.trim();

        if (!email) {

          showMessage(
            "Entre d'abord ton adresse e-mail."
          );

          return;

        }

        showMessage(
          "Envoi du lien de récupération..."
        );

        try {

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Un lien de récupération a été envoyé à ton adresse e-mail."
          );

        } catch (error) {

          console.error(error);

          showMessage(
            firebaseError(error)
          );

        }

      }
    );


    /* ==============================
       AFFICHER / MASQUER MOT DE PASSE
       ============================== */

    showPassword.addEventListener(
      "click",
      () => {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type =
            "text";

          showPassword.textContent =
            "Masquer";

        } else {

          passwordInput.type =
            "password";

          showPassword.textContent =
            "Afficher";

        }

      }
    );

  </script>

</body>
</html>
