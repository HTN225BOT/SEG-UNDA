<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | SEG UNDA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-page {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 7%;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(0, 217, 255, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(124, 92, 255, 0.18),
          transparent 35%
        );
    }
    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 40px 32px;
      background: rgba(20, 24, 48, 0.88);
      border: 1px solid rgba(124, 92, 255, 0.35);
      border-radius: 25px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        0 0 30px rgba(0, 217, 255, 0.06);
      text-align: center;
    }
    .login-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #00d9ff
      );
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.20);
    }
    .login-card h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }
    .login-card > p {
      margin-bottom: 30px;
      color: #aeb6d0;
      font-size: 0.92rem;
    }
    .login-form {
      text-align: left;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      box-sizing: border-box;
      border: 1px solid rgba(124, 92, 255, 0.35);
      border-radius: 13px;
      background: rgba(8, 11, 24, 0.75);
      color: white;
      outline: none;
      font-size: 0.95rem;
      transition: 0.3s ease;
    }
    .form-group input:focus {
      border-color: #00d9ff;
      box-shadow:
        0 0 15px rgba(0, 217, 255, 0.12);
    }
    .password-box {
      position: relative;
    }
    .password-box input {
      padding-right: 60px;
    }
    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8f98b3;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .show-password:hover {
      color: #00d9ff;
    }
    .forgot-password {
      display: block;
      margin-top: -5px;
      margin-bottom: 25px;
      color: #00d9ff;
      text-decoration: none;
      font-size: 0.85rem;
      text-align: right;
    }
    .login-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #00d9ff
      );
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.15);
      transition: 0.3s ease;
    }
    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(0, 217, 255, 0.25);
    }
    .google-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .google-btn:hover {
      border-color: #00d9ff;
      background: rgba(0, 217, 255, 0.08);
      transform: translateY(-2px);
    }
    .login-message {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #00d9ff;
      min-height: 20px;
    }
    .login-info {
      margin-top: 25px;
      color: #8f98b3;
      font-size: 0.8rem;
    }
    .back-home {
      display: inline-block;
      margin-top: 25px;
      color: #8f98b3;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s ease;
    }
    .back-home:hover {
      color: #00d9ff;
    }
    @media (max-width: 500px) {
      .login-page {
        padding: 45px 5%;
      }
      .login-card {
        padding: 32px 22px;
      }
      .login-card h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <header>
<div class="logo">
  SEG <span>UNDA</span>
</div>
<nav>
  <a href="index.html">Accueil</a>
  <a href="licence.html">Formations</a>
  <a href="licence.html">Cours</a>
  <a href="index.html#apropos">À propos</a>
</nav>
<a href="connexion.html" class="header-btn">
  Connexion
</a>
  </header>
  <main class="login-page">
<div class="login-card">
  <div class="login-icon">
    🔐
  </div>
  <h1>
    Bienvenue
  </h1>
  <p>
    Connecte-toi à ton espace SEG UNDA.
  </p>
  <form class="login-form" id="loginForm">
    <div class="form-group">
      <label for="email">
        Adresse e-mail
      </label>
      <input
        type="email"
        id="email"
        placeholder="exemple@email.com"
        required
      >
    </div>
    <div class="form-group">
      <label for="password">
        Mot de passe
      </label>
      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Ton mot de passe"
          required
        >
        <button
          type="button"
          class="show-password"
          onclick="togglePassword()"
        >
          Afficher
        </button>
      </div>
    </div>
    <a href="#" class="forgot-password">
      Mot de passe oublié ?
    </a>
    <button
      type="submit"
      class="login-btn"
    >
      Se connecter
    </button>
  </form>
  <button
    type="button"
    class="google-btn"
    id="googleBtn"
  >
    🔵 Se connecter avec Google
  </button>
  <div
    class="login-message"
    id="loginMessage"
  ></div>
  <p class="login-info">
    L'accès étudiant sera configuré progressivement.
  </p>
  <a href="index.html" class="back-home">
    ← Retour à l'accueil
  </a>
</div>
  </main>
  <footer>
<p>
  SEG UNDA — Sciences Économiques et de Gestion
</p>
<div class="signature">
  <span class="michael">MICHAEL</span>
  <small>Étudiant</small>
</div>
  </footer>
  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyC4ejbTOO1G3XbwDJ5KYH6-CiYcdQqr68k",
      authDomain: "seg-unda.firebaseapp.com",
      projectId: "seg-unda",
      storageBucket: "seg-unda.firebasestorage.app",
      messagingSenderId: "1076997262231",
      appId: "1:1076997262231:web:31b640fa8fd5991e8612d2"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const googleBtn =
      document.getElementById("googleBtn");
    const loginMessage =
      document.getElementById("loginMessage");
    googleBtn.addEventListener("click", async () => {
      loginMessage.textContent =
        "Connexion à Google...";
      try {
        const result =
          await signInWithPopup(auth, provider);
        const user =
          result.user;
        loginMessage.textContent =
          "Bienvenue " + (user.displayName || user.email) + " !";
      } catch (error) {
        console.error(error);
        loginMessage.textContent =
          "La connexion Google n'a pas pu être effectuée.";
      }
    });
    function togglePassword() {
      const password =
        document.getElementById("password");
      const button =
        document.querySelector(".show-password");
      if (password.type === "password") {
        password.type = "text";
        button.textContent = "Masquer";
      } else {
        password.type = "password";
        button.textContent = "Afficher";
      }
    }
    window.togglePassword = togglePassword;
    document
      .getElementById("loginForm")
      .addEventListener("submit", (event) => {
        event.preventDefault();
        loginMessage.textContent =
          "La connexion par e-mail sera configurée prochainement.";
      });
  </script>
</body>
</html>
