<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0”

  <title>Espace étudiant | SEG UNDA</title>
  <link
    rel="stylesheet"
    href="style.css"
  >
  <style>
    .student-page {
      min-height: 78vh;
      padding: 60px 7%;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(0, 217, 255, 0.10),
          transparent 35%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(124, 92, 255, 0.16),
          transparent 35%
        );
    }
    .student-container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .student-welcome {
      padding: 35px;
      background: rgba(20, 24, 48, 0.88);
      border: 1px solid rgba(124, 92, 255, 0.35);
      border-radius: 25px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.30),
        0 0 30px rgba(0, 217, 255, 0.05);
      display: flex;
      align-items: center;
      gap: 25px;
      margin-bottom: 30px;
    }
    .student-photo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00d9ff;
      box-shadow:
        0 0 25px rgba(0, 217, 255, 0.20);
    }
    .student-photo.hidden {
      display: none;
    }
    .student-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        #7c5cff,
        #00d9ff
      );
      color: white;
      font-size: 2rem;
      font-weight: bold;
    }
    .student-welcome h1 {
      margin-bottom: 8px;
      font-size: 2rem;
    }
    .student-welcome h1 span {
      color: #00d9ff;
    }
    .student-email {
      color: #aeb6d0;
      font-size: 0.95rem;
    }
    .student-title {
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    .student-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 20px;
    }
    .student-card {
      padding: 28px 22px;
      background: rgba(20, 24, 48, 0.80);
      border: 1px solid rgba(124, 92, 255, 0.25);
      border-radius: 20px;
      transition: 0.3s ease;
    }
    .student-card:hover {
      transform: translateY(-5px);
      border-color: #00d9ff;
      box-shadow:
        0 10px 30px rgba(0, 217, 255, 0.08);
    }
    .student-card-icon {
      font-size: 2rem;
      margin-bottom: 15px;
    }
    .student-card h3 {
      margin-bottom: 8px;
    }
    .student-card p {
      color: #8f98b3;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .logout-btn {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      color: white;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .logout-btn:hover {
      border-color: #00d9ff;
      color: #00d9ff;
      transform: translateY(-2px);
    }
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: #aeb6d0;
    }
    @media (max-width: 700px) {
      .student-page {
        padding: 45px 5%;
      }
      .student-welcome {
        flex-direction: column;
        text-align: center;
        padding: 30px 20px;
      }
      .student-grid {
        grid-template-columns: 1fr;
      }
      .student-welcome h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <header>
<div class="logo">
  SEG <span>UNDA</span>
</div>
<nav>
  <a href="index.html">
    Accueil
  </a>
  <a href="licence.html">
    Formations
  </a>
  <a href="index.html#apropos">
    À propos
  </a>
</nav>
<a
  href="espace.html"
  class="header-btn"
>
  Mon espace
</a>
  </header>
  <main class="student-page">
<div
  class="student-container"
  id="studentContent"
>
  <div class="loading">
    Chargement de ton espace...
  </div>
</div>
  </main>
  <footer>
<p>
  SEG UNDA — Sciences Économiques et de Gestion
</p>
<div class="signature">
  <span class="michael">
    MICHAEL
  </span>
  <small>
    Étudiant
  </small>
</div>
  </footer>
  <script type="module">
    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey:
        "AIzaSyC4ejbTOO1G3XbwDJ5KYH6-CiYcdQqr68k",
      authDomain:
        "seg-unda.firebaseapp.com",
      projectId:
        "seg-unda",
      storageBucket:
        "seg-unda.firebasestorage.app",
      messagingSenderId:
        "1076997262231",
      appId:
        "1:1076997262231:web:31b640fa8fd5991e8612d2"
    };
    const app =
      initializeApp(firebaseConfig);
    const auth =
      getAuth(app);
    const studentContent =
      document.getElementById(
        "studentContent"
      );
    onAuthStateChanged(
      auth,
      (user) => {
        if (!user) {
          window.location.href =
            "connexion.html";
          return;
        }
        const name =
          user.displayName ||
          "Étudiant";
        const email =
          user.email ||
          "";
        const photo =
          user.photoURL;
        const initial =
          name
            .charAt(0)
            .toUpperCase();
        studentContent.innerHTML = `
          <section class="student-welcome">
            ${
              photo
              ? `
                <img
                  src="${photo}"
                  alt="Photo de profil"
                  class="student-photo"
                >
              `
              : `
                <div class="student-avatar">
                  ${initial}
                </div>
              `
            }
            <div>
              <h1>
                Bienvenue
                <span>${name}</span> 👋
              </h1>
              <p class="student-email">
                ${email}
              </p>
            </div>
          </section>
          <h2 class="student-title">
            Ton espace étudiant
          </h2>
          <section class="student-grid">
            <div class="student-card">
              <div class="student-card-icon">
                📚
              </div>
              <h3>
                Mes formations
              </h3>
              <p>
                Retrouve les différentes
                formations de SEG UNDA.
              </p>
            </div>
            <div class="student-card">
              <div class="student-card-icon">
                📖
              </div>
              <h3>
                Mes cours
              </h3>
              <p>
                Accède progressivement
                aux cours et ressources
                disponibles.
              </p>
            </div>
            <div class="student-card">
              <div class="student-card-icon">
                👤
              </div>
              <h3>
                Mon profil
              </h3>
              <p>
                Ton compte Google est
                connecté à ton espace
                SEG UNDA.
              </p>
            </div>
          </section>
          <button
            class="logout-btn"
            id="logoutBtn"
          >
            🚪 Se déconnecter
          </button>
        `;
        document
          .getElementById("logoutBtn")
          .addEventListener(
            "click",
            async () => {
              await signOut(auth);
              window.location.href =
                "connexion.html";
            }
          );
      }
    );
  </script>
</body>
</html>
